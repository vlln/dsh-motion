<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh-motion · preview</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/preview.css" />
    <!-- Same panel, three homes: the full page, the right-sidebar tab (`embed=tab`),
         and the card in the conversation (`embed=card`). Set before first paint so
         the layout never flashes its fuller self inside a narrow column. -->
    <script>
      document.documentElement.dataset.embed = new URLSearchParams(location.search).get('embed') || '';
    </script>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <header class="topbar">
      <span id="sceneName" class="scene-name">—</span>
      <span class="spacer"></span>

      <button id="commentMode" class="icon-btn" aria-pressed="false" aria-label="批注" title="批注：点画面里的对象">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M3 3.5h10v6.2H7.4L4.6 12v-2.3H3z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="tweaksToggle" class="icon-btn" aria-pressed="false" aria-label="调整" title="显示/隐藏调整面板">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M2.5 5h11M2.5 11h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          <circle cx="6" cy="5" r="1.5" fill="var(--bg)" stroke="currentColor" stroke-width="1.2" />
          <circle cx="10" cy="11" r="1.5" fill="var(--bg)" stroke="currentColor" stroke-width="1.2" />
        </svg>
      </button>

      <details class="menu" id="project">
        <summary aria-label="项目" title="项目">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="3" cy="8" r="1.2" fill="currentColor" />
            <circle cx="8" cy="8" r="1.2" fill="currentColor" />
            <circle cx="13" cy="8" r="1.2" fill="currentColor" />
          </svg>
        </summary>
        <div class="menu-body">
          <label class="field"><span>当前</span><select id="projectPick"></select></label>
          <label class="field"><span>模板</span><select id="projectTemplate"></select></label>
          <label class="field"><span>名称</span><input id="projectName" placeholder="my-film" /></label>
          <button id="projectCreate" class="btn" style="width: 100%">新建并打开</button>
          <p class="hint" id="projectNote" hidden></p>
        </div>
      </details>

      <details class="menu" id="export">
        <summary><span>导出</span></summary>
        <div class="menu-body">
          <label class="field"><span>格式</span>
            <select id="expFormat">
              <option value="mp4">MP4（含音轨）</option>
              <option value="gif">GIF（无音频）</option>
            </select>
          </label>
          <label class="field"><span>帧率</span>
            <select id="expFps">
              <option value="30">30 fps</option>
              <option value="60">60 fps</option>
            </select>
          </label>
          <label class="field"><span>2× 超采样</span><input type="checkbox" id="expSs" /></label>
          <p class="hint" id="expEstimate"></p>
          <button id="expRun" class="btn" style="width: 100%">导出</button>
          <p class="hint" id="expResult"></p>
        </div>
      </details>

      <span class="tag" id="mode" hidden></span>
      <span class="dim" id="projectScope" hidden></span>
      <span class="dim" id="exportScope" hidden></span>
    </header>

    <div class="app">
      <main class="stage-wrap">
        <div class="canvas-box" id="canvasBox">
          <canvas id="stage"></canvas>
          <div class="selection" id="selection" hidden></div>
          <div class="slot-hl" id="slotHl" hidden></div>

          <div class="popover" id="popover" hidden>
            <div class="pop-head">
              <span id="popT">—</span>
              <button id="popClose" class="x" aria-label="close">×</button>
            </div>
            <textarea id="popText" rows="3" placeholder="这里要改成什么？"></textarea>
            <button id="popSubmit" class="send-btn">发送到对话</button>
          </div>
        </div>
      </main>

      <aside class="panel">
        <div class="stale" id="stale" hidden>
          <span>场景代码已更新</span>
          <button id="staleReload" class="btn ghost">刷新</button>
        </div>

        <section class="threads" hidden>
          <h2>批注 <span id="threadCount" hidden></span></h2>
          <div id="threads" class="thread-list"></div>
        </section>

        <section class="inspector" id="inspector"></section>

        <details class="card" id="scene" open>
          <summary><span>这一场</span><span class="dim" id="sceneCardName">—</span></summary>
          <div class="card-body">
            <label class="field"><span>段长（秒）</span><input id="sceneLen" type="number" min="0.5" step="0.1" /></label>
            <label class="field"><span>速度</span>
              <select id="sceneSpeed">
                <option value="0.5">0.5×</option>
                <option value="1">1×</option>
                <option value="2">2×</option>
              </select>
            </label>
            <p class="hint" id="sceneNote" hidden></p>
          </div>
        </details>

        <details class="card" id="texts" open hidden>
          <summary><span>这一帧的文字</span><span class="dim" id="textScope"></span></summary>
          <div class="card-body">
            <div id="textList" class="text-list"></div>
            <p class="hint" id="textNote" hidden></p>
          </div>
        </details>

        <details class="card" id="knobs" hidden>
          <summary><span>参数</span><span class="dim" id="knobScene"></span></summary>
          <div class="card-body">
            <div id="knobList" class="knob-list"></div>
            <p class="hint" id="knobNote" hidden></p>
          </div>
        </details>

        <details class="card" id="assets" open hidden>
          <summary><span>这一帧的素材</span><span class="dim" id="assetScope"></span></summary>
          <div class="card-body">
            <div id="assetList" class="asset-list"></div>
            <p class="hint" id="assetNote" hidden></p>
          </div>
        </details>
      </aside>
    </div>

    <div class="timeline">
      <div class="scenes" id="scenes">
        <div class="playhead" id="playhead"></div>
      </div>
      <div class="transport">
        <span class="readout">
          <span id="tc" class="tc">0:00.00</span>
          <span class="dim">/ <span id="dur">0:19.00</span></span>
        </span>
        <button id="play" class="btn icon" aria-label="play" title="播放 / 暂停（空格）">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path class="i-play" d="M5 3.2v9.6l8-4.8z" />
            <path class="i-pause" d="M5.4 3.4h2.2v9.2H5.4zM8.4 3.4h2.2v9.2H8.4z" style="display: none" />
          </svg>
        </button>
        <button id="loop" class="btn ghost" aria-pressed="false" title="循环播放">循环</button>
        <button id="undo" class="btn ghost" disabled title="回到上一次写入前">回退</button>
        <input id="scrub" class="scrub" type="range" min="0" max="19" step="0.01" value="0" />
      </div>
    </div>

    <script type="module" src="./src/preview.mjs"></script>
  </body>
</html>
