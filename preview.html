<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dsh-motion · preview</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./src/preview.css" />
    <!-- Same panel, three homes: the full page, the right-sidebar tab (`embed=tab`),
         and the card in the conversation (`embed=card`). Set before first paint so
         the layout never flashes its fuller self inside a narrow column. -->
    <script>
      document.documentElement.dataset.embed = new URLSearchParams(location.search).get('embed') || '';
    </script>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js",
        "three/examples/": "/node_modules/three/examples/" } }
    </script>
  </head>
  <body>
    <header class="topbar">
      <details class="version-menu" id="versionMenu">
        <summary><span id="versionLabel">版本</span><span class="dot" id="versionDot" hidden></span></summary>
        <div class="version-list" id="versionList"></div>
      </details>

      <div class="stale" id="stale" hidden>
        <span>场景代码已更新</span>
        <button id="staleReload" class="btn ghost">刷新</button>
      </div>

      <span class="spacer"></span>

      <button id="annotateMode" class="icon-btn" aria-pressed="false" aria-label="批注" title="批注：点选或框选画面">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M3 3.5h10v6.2H7.4L4.6 12v-2.3H3z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="tweaksToggle" class="icon-btn" aria-pressed="false" aria-label="调整" title="显示/隐藏调整面板">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M2.5 5h11M2.5 11h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          <circle cx="6" cy="5" r="1.5" fill="var(--bg)" stroke="currentColor" stroke-width="1.2" />
          <circle cx="10" cy="11" r="1.5" fill="var(--bg)" stroke="currentColor" stroke-width="1.2" />
        </svg>
      </button>

      <button id="exportOpen" class="export-pill" aria-label="导出" title="导出">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M8 2.6v7.2M5 7l3 3 3-3M3.4 12.4h9.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <span class="tag" id="mode" hidden></span>
      <span class="dim" id="projectScope" hidden></span>
      <span class="dim" id="exportScope" hidden></span>
    </header>

    <div class="app">
      <main class="stage-wrap">
        <div class="stage-head">
          <span id="sceneName" class="scene-name">—</span>
        </div>
        <nav class="reel" id="reel" aria-label="段落导航"></nav>
        <div class="stage-stack">
        <div class="canvas-box" id="canvasBox">
          <canvas id="stage"></canvas>
          <div class="selection" id="selection" hidden></div>
          <div class="slot-hl" id="slotHl" hidden></div>

          <div class="popover" id="popover" hidden>
            <div class="pop-head">
              <span id="popT" class="pop-time">—</span>
              <button id="popClose" class="x" aria-label="close">×</button>
            </div>
            <div class="pop-body">
              <textarea id="popText" rows="2" placeholder="这里要改成什么？"></textarea>
            </div>
            <div class="pop-foot">
              <span class="pop-hint">⌘↵ 发送</span>
              <button id="popSubmit" class="send-btn" aria-label="发送" title="发送到对话">↑</button>
            </div>
          </div>
        </div>

        </div>
      </main>

      <aside class="panel">
        <div class="rail-tabs" role="tablist">
          <button class="rail-tab" role="tab" data-tab="tweaks" aria-selected="true">调整</button>
          <button class="rail-tab" role="tab" data-tab="style" aria-selected="false">风格</button>
          <button class="rail-tab" role="tab" data-tab="comments" aria-selected="false">批注</button>
        </div>

        <div class="rail-panel" data-panel="tweaks">
        <section class="card card-static" id="scene">
          <header class="card-head">
            <span>这一场</span>
            <span class="scene-nav">
              <button id="prevScene" class="icon-btn" aria-label="上一场">‹</button>
              <span id="sceneCardName" class="dim">—</span>
              <button id="nextScene" class="icon-btn" aria-label="下一场">›</button>
            </span>
          </header>
          <div class="card-body">
            <label class="field"><span>名称</span><input id="sceneNameInput" maxlength="60" /></label>
            <label class="field"><span>段长（秒）</span><input id="sceneLen" type="number" min="0.5" step="0.1" /></label>
            <label class="field"><span>速度</span>
              <select id="sceneSpeed">
                <option value="0.5">0.5×</option>
                <option value="1">1×</option>
                <option value="2">2×</option>
              </select>
            </label>
            <p class="hint" id="sceneNote" hidden></p>
          </div>
        </section>

        <details class="card" id="texts" open hidden>
          <summary><span>这一帧的文字</span><span class="dim" id="textScope"></span></summary>
          <div class="card-body">
            <div id="textList" class="text-list"></div>
            <p class="hint" id="textNote" hidden></p>
          </div>
        </details>

        <details class="card" id="knobs" hidden>
          <summary><span>参数</span><span class="dim" id="knobScene"></span></summary>
          <div class="card-body">
            <div id="knobList" class="knob-list"></div>
            <p class="hint" id="knobNote" hidden></p>
          </div>
        </details>

        <details class="card" id="assets" open hidden>
          <summary><span>这一帧的素材</span><span class="dim" id="assetScope"></span></summary>
          <div class="card-body">
            <div id="assetList" class="asset-list"></div>
            <p class="hint" id="assetNote" hidden></p>
          </div>
        </details>

        </div>

        <div class="rail-panel" data-panel="comments" hidden>
          <div id="allComments" class="comment-list"></div>
        </div>

        <div class="rail-panel" data-panel="style" hidden>
          <p class="rail-label">配色</p>
          <div class="palette-row">
            <div id="styleList" class="palette-list"></div>
            <button id="paletteAdd" class="palette-add" aria-label="新建配色" title="新建配色">+</button>
          </div>

          <div id="paletteEditor" class="palette-editor" hidden>
            <p class="rail-label" id="paletteName">—</p>
            <div id="paletteTokens" class="token-list"></div>
            <p class="hint" id="paletteNote" hidden></p>
          </div>

          <p class="hint" id="palettePickHint">选一套配色后，可以逐个颜色修改。</p>
        </div>

      </aside>
    </div>

    <div class="timeline">
      <div class="transport">
        <button id="play" class="icon-btn" aria-label="play" title="播放 / 暂停（空格）">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path class="i-play" d="M5 3.2v9.6l8-4.8z" />
            <path class="i-pause" d="M5.4 3.4h2.2v9.2H5.4zM8.4 3.4h2.2v9.2H8.4z" style="display: none" />
          </svg>
        </button>
        <button id="loop" class="icon-btn" aria-pressed="true" aria-label="循环播放" title="循环播放">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M3.2 7.2a4.8 4.8 0 0 1 8-2.6M12.8 8.8a4.8 4.8 0 0 1-8 2.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
            <path d="M11.4 2.4v2.4H9M4.6 13.6v-2.4H7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <span class="readout">
          <span id="tc" class="tc">0:00.00</span>
          <span class="dim">/ <span id="dur">0:19.00</span></span>
        </span>

        <span class="spacer"></span>

        <button id="mute" class="icon-btn" aria-label="静音" title="静音">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M3 6.2h2.4L8 3.6v8.8L5.4 9.8H3z" fill="currentColor" />
            <path id="muteWaves" d="M10.6 6.2c.9.5 1.4 1.4 1.4 2.4s-.5 1.9-1.4 2.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
            <path id="muteSlash" d="M10.4 6.4l2.6 2.6m0-2.6l-2.6 2.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" style="display: none" />
          </svg>
        </button>
        <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量" />
        <button id="fullscreen" class="icon-btn" aria-label="全屏" title="全屏">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M3 6V3h3M13 6V3H10M3 10v3h3M13 10v3h-3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
      <div class="scenes" id="scenes">
        <div class="playhead" id="playhead"></div>
        <div class="hover-frame" id="hoverFrame" hidden>
          <canvas id="hoverCanvas" width="192" height="108"></canvas>
          <span id="hoverTime" class="hover-time"></span>
        </div>
      </div>
    </div>

    <div class="modal" id="exportModal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
        <header class="modal-head">
          <h2 id="exportTitle">导出</h2>
          <button class="icon-btn" id="exportClose" aria-label="关闭">×</button>
        </header>

        <div class="modal-row"><span>格式</span>
          <div class="seg" data-field="format">
            <button data-value="mp4" aria-pressed="true">MP4 视频</button>
            <button data-value="gif" aria-pressed="false">GIF</button>
          </div>
        </div>

        <div class="modal-row"><span>分辨率</span>
          <div class="seg" data-field="height">
            <button data-value="720" aria-pressed="false">720p</button>
            <button data-value="1080" aria-pressed="true">1080p</button>
          </div>
        </div>

        <div class="modal-row"><span>帧率</span>
          <div class="seg" data-field="fps">
            <button data-value="60" aria-pressed="true">60 fps</button>
            <button data-value="30" aria-pressed="false">30 fps</button>
            <button data-value="15" aria-pressed="false">15 fps</button>
          </div>
        </div>

        <div class="modal-row"><span>质量</span>
          <div class="seg" data-field="quality">
            <button data-value="high" aria-pressed="true">高</button>
            <button data-value="medium" aria-pressed="false">中</button>
            <button data-value="low" aria-pressed="false">低</button>
          </div>
        </div>

        <div class="modal-row"><span>文字更清晰<small>（2× 渲染，较慢）</small></span>
          <label class="switch"><input type="checkbox" id="expSs" /><span class="knob"></span></label>
        </div>

        <p class="hint" id="expEstimate"></p>

        <footer class="modal-foot">
          <button class="btn ghost" id="exportCancel">取消</button>
          <button class="btn" id="expRun">导出</button>
        </footer>
        <p class="hint" id="expResult"></p>
      </div>
    </div>

    <script type="module" src="./src/preview.mjs"></script>
  <div id="beatPeek" class="beat-peek" hidden>
      <img alt="" />
      <span class="beat-peek-label"></span>
    </div>
  </body>
</html>
